version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus_dev
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus_dev
    ports:
      - '5432:5432'
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus_dev -d nexus_dev']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  nexus_postgres_data:
    name: nexus_postgres_data
  nexus_redis_data:
    name: nexus_redis_data
